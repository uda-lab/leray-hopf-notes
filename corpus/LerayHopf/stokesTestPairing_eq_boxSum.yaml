name: LerayHopf.stokesTestPairing_eq_boxSum
tier: gloss
statement_ja: |
  帯域制限されたテスト場に対して、[[Stokes 双線形形式|LerayHopf.stokesTestPairing]]が有限和に落ちること。テスト場 $w$ がレベル $n_0$ の射影で不変なら、任意の場 $v$ について、値は $n_0$ の Fourier 箱の上の有限和で書ける。

  $$\sum_j\sum_{k\in\text{箱}}(2\pi)^2\lVert k\rVert^2\,\mathrm{Re}\bigl(\hat v_j(k)\,\overline{\hat w_j(k)}\bigr)$$

  $w$ の Fourier 係数が箱の外で消えるため、無限和が箱の上の和に一致する。
gap:
  level: none
  note: |
    同じ主張が `LerayHopf/Torus/TraceEnergy.lean` にも `stokes_boxSum` として置かれている。`private` は import 境界を越えて見えないため、下流のファイルが同じものを置き直している。
provenance: |
  Wave 4 の private gloss 機械生成テンプレートから、issue #74 第9波（Torus 極限移行チェーン: `ConvectionExtension` → `LimitPassage` → `TraceEnergy` → `ViscousLimit`）で手書き化。抽出元: `LerayHopf/Torus/LimitPassage.lean` の `LerayHopf.stokesTestPairing_eq_boxSum`。
chapter: limit-passage
tags: [private-helper, torus, limit-passage]
