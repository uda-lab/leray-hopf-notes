name: LerayHopf.fourier_ofReal_reflect_eq_conj
tier: gloss
statement_ja: |
  実 $L^2$ 元を複素化したものについて、その Fourier 変換の符号反転と複素共役が一致すること。実数値 Schwartz 関数に対する対応する等式を、Schwartz 関数の $L^2$ における稠密性で任意の実 $L^2$ 元へ延長したものである。
gap:
  level: mild
  note: |
    稠密性による延長のため、両辺が連続線形であることを使って稠密部分集合上の一致から全体の一致を出す。
provenance: |
  Wave 4 の private gloss 機械生成テンプレートから、issue #74 第12波（最終波・残り全成分）で手書き化。抽出元: `LerayHopf/Analysis/FourierParseval.lean` の `LerayHopf.fourier_ofReal_reflect_eq_conj`。
chapter: limit-passage
tags: [private-helper, fourier, schwartz]
