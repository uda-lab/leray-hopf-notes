name: LerayHopf.Galerkin.LerayHopfSolution.ofIsOn
tier: full
statement_ja: |
  逆向きの対応：曲線 $u$ が[[有限区間 Leray–Hopf 条件|LerayHopf.Galerkin.IsLerayHopfOn]]を満たすなら、**その $u$ を曲線として**[[Leray–Hopf 弱解の束|LerayHopf.Galerkin.LerayHopfSolution]]を組み立てる。

  曲線は取り替えられず、選択公理も使われない。条件の五つの条件をそのまま束の各条項に充てるだけである。
