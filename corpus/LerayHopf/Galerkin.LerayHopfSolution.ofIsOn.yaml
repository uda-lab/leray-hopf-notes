statement_ja: |
  逆向きの対応：曲線 $u$ が[[有限区間 Leray–Hopf 条件|LerayHopf.Galerkin.IsLerayHopfOn]]を満たすなら、**その $u$ を曲線として**[[Leray–Hopf 弱解データ|LerayHopf.Galerkin.LerayHopfSolution]]を組み立てる。

