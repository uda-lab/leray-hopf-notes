name: LerayHopf.gradComp_schwartz_eq
tier: gloss
statement_ja: |
  場の第 $i$ 成分が Schwartz 関数 $\psi$ の $L^2$ 類で表されているとき、その弱勾配成分は $\psi$ の古典的な方向微分を複素化したものに一致する。弱微分と古典的微分が、Schwartz の水準では一致することを述べている。場全体の $H^1$ 正則性と、第 $i$ 成分の表示を仮定する。
