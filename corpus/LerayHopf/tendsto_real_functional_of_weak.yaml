statement_ja: |
  弱収束は連続線形汎関数を通過する。点列が任意のテスト場との内積の意味で収束するなら、任意の連続な実線形汎関数の値も収束する。汎関数を Riesz の表現で内積に書き直せば、仮定がそのまま使えることによる。
