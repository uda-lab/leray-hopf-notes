statement_ja: |
  Schwartz ポテンシャルを、その curl 場と[[重み付き Fourier 成分|LerayHopf.weightedFourierComponent]]の組へ送る埋め込み。積空間での距離が、$L^2$ の誤差と粘性半ノルムの誤差の**両方**を同時に押さえる形になっている。$H^1$ のグラフノルムで近似を測るための道具。
