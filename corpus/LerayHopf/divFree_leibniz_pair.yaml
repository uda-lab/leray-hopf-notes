name: LerayHopf.divFree_leibniz_pair
tier: gloss
statement_ja: |
  発散ゼロの場に対する Leibniz 型の対の関係。仮定は、任意の Schwartz テスト関数 $\varphi$ について次が成り立つという弱い意味での発散ゼロである。

  $$\sum_a\int \psi_{u,a}\,(\partial_a\varphi)\ =\ 0$$

  このとき 2 つの Schwartz 関数 $f,g$ に対し次が成り立つ。

  $$\sum_a\int \psi_{u,a}\,(\partial_a f)\,g\ +\ \sum_a\int \psi_{u,a}\,f\,(\partial_a g)\ =\ 0$$

  仮定をテスト関数 $fg$ に適用し、積の微分を展開すれば得られる。積 $fg$ が再び Schwartz 関数であることが、この適用を許している。
