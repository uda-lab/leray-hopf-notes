name: LerayHopf.P2ExitWitness
tier: full
statement_ja: |
  **κ 連鎖の出力データ（トーラス）。** 添字写像 $\varphi_1$ に沿った従属族に対し、κ 一般化されたコンパクト性の連鎖が最後まで適用できたことを一つの主張としてまとめて保持する。

  保持する内容は、連鎖が走る全添字の基底族と、それが $\varphi_1$ に沿って**与えられた族に一致する**という移送等式、元の Galerkin 近似列を指定する外側の添字写像として $\varphi_1$ を用いた[[Aubin–Lions パッケージ|LerayHopf.AubinLionsPackage]]、パッケージ曲線のエネルギー類、極限移行が生む良い代表元 $v$ とその a.e. の対応、そして $v$ についての弱形式・エネルギー不等式・初期トレース・エネルギー類である。

  パッケージは外側の添字写像 $\kappa=\varphi_1$ を受け取ったうえで、内部にもう一段の添字写像 $\varphi$ を選ぶ。収束はこの二つを合成した添字に沿って述べられ、基底族でいえば元の列における添字 $\varphi_1(\varphi(n))$ の項を、与えられた従属族でいえば第 $\varphi(n)$ 項を見ていることになる。

  さらに部分列を定める添字写像とその狭義単調性、および**与えられた族そのもの**に対して述べられた各時刻での弱収束先の同定を保持する。
proof_ja: |
  移送等式が必須の条項として入っていることが要点である。これがないと、無関係に作り直した族の上で連鎖を適用して出力データを作れてしまい、対角化で選んだ部分列との結びつきが失われる。

  弱収束先の同定を延長した基底族ではなく与えられた族に対して述べているのも同じ理由で、後段の整合性の議論は与えられた族の上でしか意味をなさない。
gap:
  level: mild
  note: |
    エネルギー不等式は「ほとんどすべての $t$」ではなくすべての $t\in[0,T]$ の形で保持する。代表元 $v$ とパッケージ曲線はほとんど至る所でしか一致しないが、弱形式・エネルギー・トレースはすべて $v$ の側で述べられている。
provenance: |
  leray-hopf issue #195（𝕋³ 系統）/ #212（ℝ³ 系統）の時間大域キャンペーンで導入。有限区間ごとの取り出しを、対角部分列を固定したまま実行するための枠組み。
chapter: limit-passage
tags: [kappa-chain, time-global, torus]
