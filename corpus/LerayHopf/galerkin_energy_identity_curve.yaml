name: LerayHopf.Torus.galerkin_energy_identity_curve
tier: gloss
statement_ja: |
  ベクトル場の流れに沿ったエネルギー恒等式。曲線 $c$ が各非負時刻で Galerkin の常微分方程式のベクトル場を微分係数に持つとき、非負の各時刻で次が成り立つ。

  $$\frac{d}{ds}\Bigl(\tfrac12\lVert c(s)\rVert^2\Bigr)\Big|_{s=t}\ =\ -\nu\,\Phi_1(c(t))$$

  $\Phi_1$ は粘性係数 $1$ での[[粘性形式|LerayHopf.viscousFormSq]]である。移流項が反対称性により消え、粘性項だけが残る。
gap:
