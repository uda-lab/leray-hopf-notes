name: LerayHopf.StageData_R3
tier: full
statement_ja: |
  **段ごとの再帰のデータ（$\mathbb{R}^3$）。** 第 $m$ 段の状態として、前段に対する相対抽出とその狭義単調性、第 $0$ 段から数えた絶対抽出とその狭義単調性、第 $m$ 段の弱極限曲線 $U$、および収束不変量を束ねる。

  収束不変量は、区間 $[0,m+1]$ のすべての時刻と**周囲の $L^2$ ベクトル場全体**を走るすべてのテスト元について、絶対抽出に沿った Galerkin 近似との内積が $\langle U(t),z\rangle$ へ収束することを述べる。テスト空間が全空間である点が[[トーラス側の対応物|LerayHopf.StageData]]との違いで、この形の方が強い。
gap:
  level: mild
  note: |
    テスト空間を全空間に取れるのは[[段の取り出し|LerayHopf.exists_weakLimitCurve_R3_kappa]]が全空間テストの収束を返すからで、この強さは後段で良い代表元との一致を示す際にそのまま使われる。
provenance: |
  leray-hopf issue #195（𝕋³ 系統）/ #212（ℝ³ 系統）の時間大域キャンペーンで導入。
chapter: compactness
tags: [diagonal-subsequence, time-global, r3]
