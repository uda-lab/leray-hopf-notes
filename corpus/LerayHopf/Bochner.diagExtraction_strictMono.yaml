name: LerayHopf.Bochner.diagExtraction_strictMono
tier: full
statement_ja: |
  各段の段間の添字写像がすべて狭義単調ならば、[[対角添字写像|LerayHopf.Bochner.diagExtraction]]も狭義単調である。したがって対角列は元の列の部分列になる。
proof_ja: |
  隣り合う $k$ と $k+1$ を比べれば十分である。第 $k+1$ 項は、第 $k$ 段の合成添字写像を $e_{k+1}(k+1)$ に施したものと一致する。

  狭義単調な自然数列は各点で恒等写像以上、すなわち $k+1\le e_{k+1}(k+1)$ が成り立つ。第 $k$ 段の合成添字写像を $g$ と書けば、その単調性から次の連鎖が得られる。

  $$\delta(k)=g(k)<g(k+1)\le g\bigl(e_{k+1}(k+1)\bigr)=\delta(k+1)$$
gap:
  level: mild
chapter: bochner
tags: [diagonal-subsequence, time-global]
