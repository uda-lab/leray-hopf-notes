name: LerayHopf.tendsto_setLIntegral_closedBall
tier: gloss
statement_ja: |
  球による汲み尽くしの補題。可測函数の閉球上での積分は、半径を自然数に沿って大きくすると全空間での積分に収束する。閉球が全空間を汲み尽くすことによる。函数は非負値（拡張実数値）で、可測性のみを仮定する。
gap:
