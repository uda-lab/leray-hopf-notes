name: LerayHopf.eLpNorm_three_component_toReal_le_energy
tier: gloss
statement_ja: |
  $L^3$ ノルムの補間評価。$C_6$ の非負性と、上と同じ拡張実数値での $L^6$ の仮定を置く。このとき、各成分が Schwartz 関数で代表されるベクトル場 $u$ について、各成分の $L^3$ ノルムが $u$ の $L^2$ ノルムと粘性散逸形式で押さえられる。

  $$\bigl\lVert\psi_a\bigr\rVert_{L^3}\ \le\ \sqrt{C_6}\,\lVert u\rVert^{1/2}\,V_1^{1/4}$$

  $L^3$ を $L^2$ と $L^6$ の間で指数 $1/2$ ずつ補間し、$L^2$ 側を速度場のノルムで、$L^6$ 側を仮定で置き換えて得られる。
gap:
  level: mild
  note: |
    補間不等式は拡張実数値で述べられているため、両辺の有限性を確かめてから実数値に移す手順が必要になる。指数の整理には `rpow_const_sqrt_quarter_energy` を用いる。
provenance: |
  Wave 4 の private gloss 機械生成テンプレートから、issue #74 第7波（`TrilinearEstimate.lean`＋`GalerkinTrilinearBound.lean` クラスタ）で手書き化。抽出元: `LerayHopf/R3/GalerkinTrilinearBound.lean` の `LerayHopf.eLpNorm_three_component_toReal_le_energy`。
chapter: limit-passage
