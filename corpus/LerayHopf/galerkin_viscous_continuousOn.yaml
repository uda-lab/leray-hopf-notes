name: LerayHopf.galerkin_viscous_continuousOn
tier: gloss
statement_ja: |
  Galerkin 曲線に沿った粘性散逸が $[0,\infty)$ 上で連続であること。曲線がレベル $n$ に帯域制限されているため[[粘性形式|LerayHopf.viscousFormSq]]は Fourier 箱の上の有限和になり、各項が曲線の連続性から連続だからである。無限和のままでは項別の連続性から全体の連続性は出ないので、有限和に落ちることが要点である。
gap:
  level: none
  note: |
    同じ主張が `LerayHopf/Torus/ViscousLimit.lean` にも `galerkin_visc_cont` として置き直されている（`private` による複製）。
provenance: |
  Wave 4 の private gloss 機械生成テンプレートから、issue #74 第9波（Torus 極限移行チェーン: `ConvectionExtension` → `LimitPassage` → `TraceEnergy` → `ViscousLimit`）で手書き化。抽出元: `LerayHopf/Torus/TraceEnergy.lean` の `LerayHopf.galerkin_viscous_continuousOn`。
chapter: energy
tags: [private-helper, torus, energy]
