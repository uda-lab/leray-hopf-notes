name: LerayHopf.abs_tail_inner_le
tier: gloss
statement_ja: |
  裾の部分に対する Cauchy–Schwarz 評価。$2$ つのベクトル場の裾どうしの内積は、片方の裾のノルムと、もう片方の**全空間**でのノルムとの積で押さえられる。

  $$|\langle v_{\mathrm{tail}},\,w_{\mathrm{tail}}\rangle|\ \le\ \lVert v_{\mathrm{tail}}\rVert\,\lVert w\rVert$$

  右辺の第 2 因子が裾ではなく全体のノルムであるため、この評価は第 2 引数について一様に使える。
