name: LerayHopf.schwartz_trilinear_bound
tier: gloss
statement_ja: |
  3 つのスカラー値 Schwartz 関数の積の積分に対する項別評価。2 つを $L^2$ の対として扱い、残る 1 つは一様な上界で外に出す。

  $$\left|\int f\,g\,h\right|\ \le\ \lVert f\rVert_{L^2}\,\lVert g\rVert_{L^2}\;N_0(h)$$

  ここで $N_0(h)$ は $h$ の $0$ 次のセミノルムであり、各点で $|h(x)|$ を上から押さえる。
gap:
  level: mild
  note: |
    $N_0$ は `SchwartzMap.seminorm ℝ 0 0`。証明が使うのは各点評価 `SchwartzMap.norm_le_seminorm` の向きだけで、上限との一致は用いていない。
provenance: |
  Wave 4 の private gloss 機械生成テンプレートから、issue #74 第7波（`TrilinearEstimate.lean`＋`GalerkinTrilinearBound.lean` クラスタ）で手書き化。抽出元: `LerayHopf/R3/TrilinearEstimate.lean` の `LerayHopf.schwartz_trilinear_bound`。
chapter: limit-passage
tags: [private-helper, schwartz, convection]
