name: LerayHopf.velocityProjection_eq_sum_inner
tier: gloss
statement_ja: |
  発散ゼロな場に対する Galerkin 切断が、有限次元のモード空間の正規直交座標での展開に一致すること。

  $$P_N x\ =\ \sum_i\langle x,\,b_i\rangle\,b_i$$

  ここで $b_i$ はレベル $N$ のモード空間の正規直交基底である。切断がモード空間に属することと、有限次元空間での正規直交展開による。係数は全空間での内積として書ける（モード空間の内積に取り替える必要がない）。
gap:
  level: none
provenance: |
  Wave 4 の private gloss 機械生成テンプレートから、issue #74 第11波（Torus モード/Galerkin 連鎖: `AubinLionsAssembly` → `ModeTail` → `ModeCompactness` → `GalerkinODESolve`）で手書き化。抽出元: `LerayHopf/Torus/ModeCompactness.lean` の `LerayHopf.velocityProjection_eq_sum_inner`。
chapter: compactness
tags: [private-helper, torus, compactness]
