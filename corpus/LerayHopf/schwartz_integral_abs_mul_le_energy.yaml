name: LerayHopf.schwartz_integral_abs_mul_le_energy
tier: gloss
statement_ja: |
  絶対値をとってからの Cauchy–Schwarz 評価。

  $$\int|f|\,|g|\ \le\ \lVert f\rVert_{L^2}\,\lVert g\rVert_{L^2}$$

  指数対 $(2,2)$ に対する Hölder の不等式である。
gap:
  level: none
  note: |
