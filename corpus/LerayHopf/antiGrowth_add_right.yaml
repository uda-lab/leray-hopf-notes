name: LerayHopf.FourierL2.antiGrowth_add_right
tier: gloss
statement_ja: |
  右平行移動に対する逆向きの増大評価。任意の $x$ について次を満たす指数と定数が取れる。

  $$\lVert x\rVert\ \le\ (1+\lVert h\rVert)\,(1+\lVert x+h\rVert)$$

  平行移動を Schwartz 関数の合成として扱うために必要な条件である。
