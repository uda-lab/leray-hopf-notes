name: LerayHopf.mul_div_two_mul_add_one_lt
tier: gloss
statement_ja: |
  **上限評価から $L^2$ 評価への許容量。** $V\ge0$ と $\varepsilon>0$ に対して次が成り立つ。

  $$V\cdot\frac{\varepsilon}{2(V+1)}<\varepsilon$$

  質量 $V$ を固定したうえで上限レベルの許容量を $\varepsilon/(2(V+1))$ と取れば、質量因子 $V$ を掛けても目標の $\varepsilon$ を超えない、という形で使う。許容量は $V$ に依存するので、球の質量を押さえてから選ぶ。

  分母の $+1$ は二つの役割をもつ。$V=0$ でも分母が退化しないことと、質量因子が分母の因子で押さえられること、すなわち等号を許す評価 $V\le V+1$ が成り立つことである。証明はこの等号を許す評価をそのまま使い、次を経由する。

  $$V\cdot\frac{\varepsilon}{2(V+1)}\le\frac{\varepsilon}{2}$$

  結論はここから $\varepsilon/2<\varepsilon$ として閉じる。$V/(V+1)<1$ による狭義の評価 $\varepsilon/2$ 未満も $V\ge0$ で真だが、これは本補題の主張でも証明が確立していることでもない。
gap:
  level: none
provenance: |
  leray-hopf issue #154 Wave 2（PR #226）で `FrechetKolmogorov.lean` から textbook step として切り出された private 補題。抽出元: `LerayHopf/R3/FrechetKolmogorov.lean` の `LerayHopf.mul_div_two_mul_add_one_lt`。

  原文の doc comment は leray-hopf#229（PR #231）で二段階に修正された。当初の「分母の +1 が評価を V について一様にし、球の質量を知る前に同じ許容量が使える」という記述が誤りで、その置き換え案（証明が V/(V+1) < 1 を用いて狭義の ε/2 未満を示すとするもの）も、実際の証明が等号を許す V ≤ V+1 を経由することと食い違っていた。本 gloss は notes#130 の repin で最終版の doc comment に整合させてある。
chapter: compactness
