name: LerayHopf.reSchwartz_L3_approx
tier: gloss
statement_ja: |
  微分しない側について $L^3$ の収束も持つ Schwartz 近似。複素 $L^2$ 場 $h$ が $H^{1,2}$ に属し、方向 $e_a$ の弱微分が別の複素 $L^2$ 場で表されるとする。このとき実数値 Schwartz 列 $\psi_n$ を取って、次の 3 つを同時に満たすようにできる。

  $\psi_n$ の $L^2$ 類が $h$ の実部へ $L^2$ で収束し、$\partial_a\psi_n$ の $L^2$ 類が弱微分の実部へ $L^2$ で収束し、さらに $\psi_n$ が $h$ の実部へ $L^3$ でも収束する。

  [[実部の勾配まで収束する Schwartz 近似|LerayHopf.reSchwartz_approx]]は前 2 つだけを与える。3 つの因子の積を扱うときは Hölder の指数を合わせるために $L^2$ だけでは足りず、微分しない因子に $L^3$ の収束が要る。
gap:
  level: mild
  note: |
    多方向の近似列の実部を取る構成で、$L^3$ 収束は値の収束から別途導く。$L^2$ の 2 本と合わせて 3 つの収束を同時に満たす列であることが要点。
provenance: |
  Wave 4 の private gloss 機械生成テンプレートから、issue #74 第10波（H¹ Leibniz → エネルギー類移流 → Galerkin 曲線/基底: `WeakLeibniz` → `EnergyClassConvection` → `GalerkinCurveBounds` / `GalerkinBasisH1`）で手書き化。抽出元: `LerayHopf/Analysis/WeakLeibniz.lean` の `LerayHopf.reSchwartz_L3_approx`。
chapter: energy
tags: [private-helper, schwartz, sobolev]
