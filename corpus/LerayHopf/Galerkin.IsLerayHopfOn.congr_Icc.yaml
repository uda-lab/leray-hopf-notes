name: LerayHopf.Galerkin.IsLerayHopfOn.congr_Icc
tier: full
statement_ja: |
  **条件は区間上の値しか見ない。** $T>0$ とし、二本の曲線が $[0,T]$ 上で**各点**一致するとする。一方が $[0,T]$ 上で[[有限区間 Leray–Hopf 条件|LerayHopf.Galerkin.IsLerayHopfOn]]を満たせば、他方も満たす。

  時間大域化では、区間ごとに得られる解の代表元を、対角極限として得た一本の曲線へ移すためにこの補題を使う。
proof_ja: |
  弱形式は[[曲線の合同|LerayHopf.Galerkin.WeakFormNS.congr_Icc]]による。エネルギー不等式は、各時刻の値と散逸の時間積分をいずれも一致する側へ書き換えれば移る。

  初期トレースには $T>0$ が効く。原点の右側近傍で二本の曲線は一致するので、片側極限は共通である。

  ほとんど至る所の所定の正則性空間への所属・散逸の可積分性・時間可測性は、各点一致から従うほとんど至る所の一致を通して移送される。
gap:
  level: mild
  note: |
    仮定は各点一致であり、ほとんど至る所の一致ではない。初期トレースの移送は零集合を無視できないため、ここを弱めると証明が通らない。対角整合性の側が各点一致を供給できるので、この強い形のままで足りている。
chapter: galerkin-generic
tags: [galerkin-domain, time-global]
