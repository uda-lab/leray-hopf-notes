name: LerayHopf.Torus.galerkin_reg_bound_curve
tier: gloss
statement_ja: |
  **正則性の時間積分の評価。** 粘性係数と時間長を正とし、曲線が初期時刻で初期値の射影に一致し、各非負時刻で Galerkin のベクトル場を微分係数に持つとする。このとき [[H¹ エネルギー|LerayHopf.h1EnergySq]] の時間積分が次で押さえられる。

  $$\int_0^T E_{H^1}(c(t))\,dt\ \le\ T\lVert u_0\rVert^2+\frac{\lVert u_0\rVert^2}{2\nu}$$

  $H^1$ エネルギーを $L^2$ 部分と勾配部分に分け、前者は各時刻の一様エネルギー評価から $T\lVert u_0\rVert^2$ 以下、後者は粘性散逸の積分評価から得られる。
gap:
  level: mild
  note: |
    勾配部分の係数 $(2\pi)^{-2}$ が $1$ 以下であることを使って、粘性散逸の評価をそのまま流用している。
provenance: |
  Wave 4 の private gloss 機械生成テンプレートから、issue #74 第11波（Torus モード/Galerkin 連鎖: `AubinLionsAssembly` → `ModeTail` → `ModeCompactness` → `GalerkinODESolve`）で手書き化。抽出元: `LerayHopf/Torus/GalerkinODESolve.lean` の `LerayHopf.Torus.galerkin_reg_bound_curve`。
chapter: ode
tags: [private-helper, torus, ode]
