name: LerayHopf.stageData_comp_eq_nestedComp
tier: full
statement_ja: |
  **結合不変量。** [[段の再帰|LerayHopf.stageData]]が保持する累積添字写像は、各段の添字写像を抽象的に合成した[[累積添字写像|LerayHopf.Bochner.nestedComp]]と一致する。
proof_ja: |
  段数についての帰納法による。第 $0$ 段は両者とも第 $0$ 段の添字写像そのもの、帰納段は再帰の定義と合成の定義がともに「右から合成する」形をしていることによる。
gap:
  level: none
  note: |
    この等式が、具体的な段の再帰と偏微分方程式に依存しない[[抽象的な対角部分列補題|LerayHopf.Bochner.exists_diagonal_extraction]]とを接続する唯一の接点である。ここが破れると対角列が段の列の細分になっている保証が失われる。
chapter: compactness
tags: [diagonal-subsequence, time-global, torus]
