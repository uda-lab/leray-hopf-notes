name: LerayHopf.reSchwartz_approx
tier: gloss
statement_ja: |
  成分ごとの Schwartz 近似で、実部の勾配まで収束させられること。複素 $L^2$ 場 $f$ が $H^{1,2}$ に属し、方向 $e_a$ の弱微分が $g$ で表されるとする。このとき実数値 Schwartz 列 $\psi_n$ を取って、$\psi_n$ の $L^2$ 類が $f$ の実部へ、$\partial_a\psi_n$ の $L^2$ 類が $g$ の実部へ、いずれも $L^2$ で収束するようにできる。

  弱微分を持つ場を、微分ごと Schwartz 列で近似できるという主張である。
gap:
