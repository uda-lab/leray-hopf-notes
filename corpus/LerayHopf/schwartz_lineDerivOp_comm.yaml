name: LerayHopf.schwartz_lineDerivOp_comm
tier: gloss
statement_ja: |
  Schwartz 関数に対する Clairaut の定理。2 つの方向微分は順序を入れ替えても各点で同じ値を与える。

  $$(\partial_u\partial_v f)(x)\ =\ (\partial_v\partial_u f)(x)$$

  Schwartz 関数は何度でも微分でき、2 階微分が対称であることによる。
