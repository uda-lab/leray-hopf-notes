name: LerayHopf.tendsto_rpow_of_tendsto_zero
tier: gloss
statement_ja: |
  実数値関数が $0$ に収束し、指数 $p$ が正であれば、その $p$ 乗も $0$ に収束する。収束はフィルタに沿ったもので、フィルタと添字型は任意である。
gap:
  level: none
  note: |
    型は $f$ の符号について何も仮定していない。原文の docstring は括弧書きで底が非負の側から近づく場合に触れているが、主張自体は符号条件を課しておらず、$0$ での実数冪の連続性だけを使っている。
provenance: |
  Wave 4 の private gloss 機械生成テンプレートから、issue #74 第7波（`TrilinearEstimate.lean`＋`GalerkinTrilinearBound.lean` クラスタ）で手書き化。抽出元: `LerayHopf/R3/GalerkinTrilinearBound.lean` の `LerayHopf.tendsto_rpow_of_tendsto_zero`。
chapter: limit-passage
tags: [private-helper, energy]
