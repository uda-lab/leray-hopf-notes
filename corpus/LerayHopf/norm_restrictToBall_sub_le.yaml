name: LerayHopf.norm_restrictToBall_sub_le
tier: gloss
statement_ja: |
  [[球への制限|LerayHopf.restrictToBall]]は差について $1$-Lipschitz である。制限した差の $L^2$ ノルムは、制限する前の差のノルムを超えない。

  $$\lVert u\!\restriction_{B_R}-\,v\!\restriction_{B_R}\rVert\ \le\ \lVert u-v\rVert$$

  制限は積分域を縮めるだけなので、差の $L^2$ 量が増えることはない。
