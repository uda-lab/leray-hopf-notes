name: LerayHopf.lineDeriv_toLp_norm_le_sqrt_viscous_energy
tier: gloss
statement_ja: |
  各偏微分の $L^2$ ノルムは、粘性散逸形式の平方根で押さえられる。ベクトル場の各成分が Schwartz 関数 $\psi_i$ で代表されるとき、任意の成分 $i$ と方向 $a$ について次が成り立つ。

  $$\bigl\lVert\partial_a\psi_i\bigr\rVert_{L^2}\ \le\ \sqrt{V_1}$$

  $V_1$ は[[粘性散逸形式|LerayHopf.viscousFormSq_R3]]の $\nu=1$ の値である。単一の項が、成分と方向の両方についての二重総和以下であることによる。
gap:
