name: LerayHopf.Torus.galerkin_viscous_bound
tier: gloss
statement_ja: |
  **粘性散逸の時間積分の評価。** 粘性係数と時間長を正とし、曲線が初期時刻で初期値の射影に一致し、各非負時刻で Galerkin のベクトル場を微分係数に持つとする。このとき次が成り立つ。

  $$\int_0^T\Phi_1(c(t))\,dt\ \le\ \frac{\lVert u_0\rVert^2}{2\nu}$$

  エネルギー恒等式を時間について積分し、終端での運動エネルギーが非負であることを捨てて得られる。散逸の総量が初期エネルギーで抑えられるという、Leray–Hopf の枠組みの基本評価の Galerkin 版である。
gap:
  level: mild
  note: |
    被積分関数の可積分性が事前には分からないため、可積分な場合とそうでない場合に分けて扱う必要がある。
provenance: |
  Wave 4 の private gloss 機械生成テンプレートから、issue #74 第11波（Torus モード/Galerkin 連鎖: `AubinLionsAssembly` → `ModeTail` → `ModeCompactness` → `GalerkinODESolve`）で手書き化。抽出元: `LerayHopf/Torus/GalerkinODESolve.lean` の `LerayHopf.Torus.galerkin_viscous_bound`。
