name: LerayHopf.integrand_integrable'
tier: gloss
statement_ja: |
  三線形形式の $(i,a)$ 成分の被積分関数は Lebesgue 可積分である。すなわち Schwartz 成分族 $\psi_u,\psi_v,\psi_w$ と添字 $i,a$ に対し、次の関数が可積分になる。

  $$x\ \mapsto\ \psi_{u,a}(x)\,(\partial_a\psi_{v,i})(x)\,\psi_{w,i}(x)$$

  Schwartz 関数の積と方向微分はいずれも Schwartz 関数であり、Schwartz 関数は可積分だからである。
gap:
