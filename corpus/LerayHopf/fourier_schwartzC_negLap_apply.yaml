name: LerayHopf.fourier_schwartzC_negLap_apply
tier: gloss
statement_ja: |
  負の Laplacian の Fourier 記号。複素化した負の Laplacian の Fourier 変換は、波数による重みを掛けたものになる。

  $$\widehat{-\Delta f}(\xi)\ =\ (2\pi)^2\lVert\xi\rVert^2\,\widehat{f}(\xi)$$

  各軸について 1 階微分の記号を 2 度適用して得られる。
