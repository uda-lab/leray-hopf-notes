statement_ja: |
  Schwartz 関数の積に対する方向微分の古典的な Leibniz 則。方向 $v$ と点 $x$ を任意にとったとき、次が成り立つ。

  $$\partial_v(fg)(x)\ =\ (\partial_v f)(x)\,g(x)+f(x)\,(\partial_v g)(x)$$
