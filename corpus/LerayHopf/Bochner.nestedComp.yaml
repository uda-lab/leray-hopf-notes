name: LerayHopf.Bochner.nestedComp
tier: full
statement_ja: |
  段階ごとの添字写像の族 $e$ に対し、第 $0$ 段から第 $m$ 段までを合成した**合成添字写像** $e_0\circ e_1\circ\cdots\circ e_m$ を与える。

  第 $m+1$ 段の写像 $e_{m+1}$ は第 $m$ 段で得られた部分列に対する前段に対する**相対的な**添字写像なので、合成添字写像を作るには右から合成する。すなわち第 $m+1$ 段の合成添字写像は、第 $m$ 段の合成添字写像に $e_{m+1}$ を後ろから代入したものである。
proof_ja: |
  各段で部分列をさらに細くしていくとき、実際に第 $m$ 段で選ばれている元の列の添字は、段ごとの選択をすべて遡って合成したものになる。この量を段数についての再帰で定義したのが本項目であり、以降の対角化はすべてこの合成添字写像を通じて述べられる。
gap:
  level: none
provenance: |
  leray-hopf issue #195（𝕋³ 系統）/ #212（ℝ³ 系統）の時間大域キャンペーンで導入。順序論のみに依存し、偏微分方程式側の仮定を一切含まない。
chapter: bochner
tags: [diagonal-subsequence, time-global]
