name: LerayHopf.eLpNorm_restrictToBall_stepCurve_diff_le
tier: gloss
statement_ja: |
  良い標本点による階段近似の誤差評価。時間長を正、分割数 $m$ を正とし、時間区間を $m$ 等分して各区画からその区画内の標本時刻 $\tau_i$ を選ぶ。区画ごとの振れ幅の総和が $B$ で押さえられているとする。

  $$\sum_i\int_{\text{第 }i\text{ 区画}}\lVert u(t)-u(\tau_i)\rVert^2\,dt\ \le\ B$$

  このとき、Galerkin 曲線を半径 $k$ の球へ制限したものと、標本点の値から作った階段曲線との差は、時間区間上の $L^2$ ノルムで $\sqrt B$ 以下になる。

  球への制限が $1$-Lipschitz であることから、差は各時刻で $\lVert u(t)-u(\tau_{i(t)})\rVert$ で押さえられる。この量の $L^2$ ノルムを区画ごとに計算すると仮定の総和に一致するため、平方根を取って結論を得る。
gap:
  level: mild
  note: |
    分割数・標本時刻・階段曲線が満たすべき関係を仮定として明示的に受け取る形になっており、区画ごとの積分と全体の $L^2$ ノルムを結ぶ書き換えが証明の大半を占める。数学的内容は「各点評価を区画ごとに積分して足す」ことに尽きる。
provenance: |
  Wave 4 の private gloss 機械生成テンプレートから、issue #74 第8波（コンパクト性エンジン 4 モジュール: `SpatialCompactness` / `SpacetimePrecompact` / `ArzelaAscoliTime` / `Bochner.StepFunctionCompactness`）で手書き化。抽出元: `LerayHopf/R3/SpacetimePrecompact.lean` の `LerayHopf.eLpNorm_restrictToBall_stepCurve_diff_le`。
chapter: compactness
tags: [private-helper, compactness, galerkin]
