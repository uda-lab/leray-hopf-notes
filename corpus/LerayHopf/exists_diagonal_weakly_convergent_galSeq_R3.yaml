name: LerayHopf.exists_diagonal_weakly_convergent_galSeq_R3
tier: full
statement_ja: |
  **対角部分列と大域弱極限（$\mathbb{R}^3$）。** 任意の Galerkin 近似族に対し、狭義単調な対角部分列 $\delta$ と曲線 $W$ がとれて、すべての前向き時刻 $t$ と、周囲の $L^2$ ベクトル場全体を走るすべてのテスト元 $z$ について、$\delta$ に沿った Galerkin 近似との内積が $\langle W(t),z\rangle$ へ収束する。

  部分列も曲線も時刻の範囲に依存しない。テスト空間が全空間である点が[[トーラス側の対応物|LerayHopf.exists_diagonal_weakly_convergent_galSeq]]より強い。
proof_ja: |
  対角部分列として[[対角抽出|LerayHopf.Bochner.diagExtraction]]を、曲線として[[対角弱極限曲線|LerayHopf.diagWeakLimit_R3]]をとる。

  時刻 $t$ と段 $m$ を固定すると、曲線の定義で使う段の窓にも $t$ は属するので、[[段の整合性|LerayHopf.stageData_R3_U_coherent]]により第 $m$ 段の極限と曲線の値は一致する。あとは[[移送|LerayHopf.stageData_R3_diag_tendsto]]の収束をその一致で書き換えればよい。
gap:
  level: mild
  note: |
    得られるのは各時刻での弱収束のみで、弱解であることはこの段階では何も言えていない。
provenance: |
  leray-hopf issue #195（𝕋³ 系統）/ #212（ℝ³ 系統）の時間大域キャンペーンで導入。 時間大域キャンペーンの P3′ 段に相当する。
chapter: compactness
tags: [diagonal-subsequence, time-global, r3]
