name: LerayHopf.Torus.galerkin_energy_bound_curve
tier: gloss
statement_ja: |
  **一様エネルギー評価。** 粘性係数を正とし、曲線が初期時刻で初期値の射影に一致し、各非負時刻でベクトル場を微分係数に持つとする。このとき非負の各時刻で運動エネルギーは初期値のそれを超えない。

  $$\tfrac12\lVert c(t)\rVert^2\ \le\ \tfrac12\lVert P_n u_0\rVert^2$$

  エネルギー恒等式の右辺が非正であることから、単調非増加として従う。
