name: LerayHopf.exists_ae_strong_subseq
tier: gloss
statement_ja: |
  ほとんど至るところ強収束する部分列の取り出し。Aubin–Lions のパッケージが与える時空間ノルムでの強収束から、さらに部分列を取れば、ほとんどすべての時刻で場が $L^2$ の意味で強収束するようにできる。ノルム収束から測度収束へ、測度収束からほとんど至るところ収束する部分列へ、と 2 段で移る標準的な議論である。
gap:
  level: none
  note: |
    時間長の正値性は型にあるが証明では使われていない（`_hT`）。部分列の狭義単調性についても同様（`_hκ`）。
provenance: |
  Wave 4 の private gloss 機械生成テンプレートから、issue #74 第9波（Torus 極限移行チェーン: `ConvectionExtension` → `LimitPassage` → `TraceEnergy` → `ViscousLimit`）で手書き化。抽出元: `LerayHopf/Torus/TraceEnergy.lean` の `LerayHopf.exists_ae_strong_subseq`。
chapter: energy
tags: [private-helper, torus, energy]
