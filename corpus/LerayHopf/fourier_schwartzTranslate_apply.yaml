name: LerayHopf.FourierL2.fourier_schwartzTranslate_apply
tier: gloss
statement_ja: |
  平行移動と変調の対応（Schwartz の水準）。平行移動した関数の Fourier 変換は、位相因子ともとの変換の積になる。

  $$\widehat{\psi(\cdot+h)}(\xi)\ =\ e_h(\xi)\,\widehat{\psi}(\xi)$$

  各点で成り立つ等式である。
