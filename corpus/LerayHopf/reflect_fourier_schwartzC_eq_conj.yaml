name: LerayHopf.reflect_fourier_schwartzC_eq_conj
tier: gloss
statement_ja: |
  実数値 Schwartz 関数を複素化したものについて、その Fourier 変換を符号反転したものと複素共役を取ったものが、$L^2$ の元として一致すること。実数値関数の Fourier 変換が持つ Hermite 対称性を、各点の等式から $L^2$ 類の等式へ持ち上げたものである。
