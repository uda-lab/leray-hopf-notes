name: LerayHopf.schwartz_cauchy_schwarz
tier: gloss
statement_ja: |
  スカラー値 Schwartz 関数の対に対する Cauchy–Schwarz 不等式。積の積分は、それぞれの $L^2$ ノルムの積で押さえられる。

  $$\left|\int f\,g\right|\ \le\ \lVert f\rVert_{L^2}\,\lVert g\rVert_{L^2}$$

  積分が $L^2$ における内積に一致することから従う。
