name: LerayHopf.galerkin_stokes_curve_continuousOn
tier: gloss
statement_ja: |
  固定した $H^1$ テストに対する[[粘性ペアリング|LerayHopf.stokesTestPairing_R3]]が、Galerkin 曲線に沿って $[0,\infty)$ 上で連続であること。テストを固定するとペアリングが曲線について連続線形になり、曲線の連続性が伝わることによる。
