name: LerayHopf.viscousComponent_eq_inner_negLap
tier: gloss
statement_ja: |
  成分ごとの粘性 Plancherel ペアリング。Schwartz 成分をテストに取ったとき、Fourier 側の波数荷重付き積分は、実 $L^2$ 内積として書き直せる。

  $$\int(2\pi)^2\lVert\xi\rVert^2\,\mathrm{Re}\bigl(\hat u_j\overline{\hat\psi_j}\bigr)d\xi\ =\ \bigl\langle u_j,\,-\Delta\psi_j\bigr\rangle$$

  波数荷重が負の Laplacian の記号に一致することと、Plancherel の等式による。
