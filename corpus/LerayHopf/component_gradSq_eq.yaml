name: LerayHopf.component_gradSq_eq
tier: gloss
statement_ja: |
  単一成分に対する Plancherel 型の等式。ベクトル場の第 $i$ 成分が Schwartz 関数 $\psi_i$ で代表されるとき、その偏微分の $L^2$ 質量を方向について総和したものは、Fourier 側のスペクトル荷重付き積分に等しい。

  $$\sum_a\bigl\lVert\partial_a\psi_i\bigr\rVert_{L^2}^2\ =\ \int(2\pi)^2\lVert\xi\rVert^2\,\bigl\lVert\widehat{v_i}(\xi)\bigr\rVert^2\,d\xi$$

  仮定は「第 $i$ 成分が $\psi_i$ の $L^2$ 元と一致すること」であり、他の成分については何も要求しない。
gap:
  level: mild
  note: |
    実数値の Schwartz 関数を複素化してから Fourier 側に渡すため、複素化と方向微分が可換であること（`lineDeriv_postcomp_apply`）と、複素化した成分射影が同じ代表元を与えることを個別に用意する必要がある。数学的内容は Plancherel の等式 1 回分。
provenance: |
  Wave 4 の private gloss 機械生成テンプレートから、issue #74 第7波（`TrilinearEstimate.lean`＋`GalerkinTrilinearBound.lean` クラスタ）で手書き化。抽出元: `LerayHopf/R3/GalerkinTrilinearBound.lean` の `LerayHopf.component_gradSq_eq`。
chapter: limit-passage
tags: [private-helper, schwartz, energy]
