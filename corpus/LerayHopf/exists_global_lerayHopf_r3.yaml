name: LerayHopf.exists_global_lerayHopf_r3
tier: full
statement_ja: |
  **時間大域 Leray–Hopf 弱解の存在（$\mathbb{R}^3$）。** 発散ゼロな初期値 $u_0\in L^2_\sigma(\mathbb{R}^3)$ と粘性係数 $\nu>0$ に対して、あるスキーム $\mathfrak{G}$ と形式束 $F$、および**ただ一本の**曲線 $u$ が存在し、**すべての** $T>0$ について $u$ が $[0,T]$ 上の[[Leray–Hopf 契約|LerayHopf.Galerkin.IsLerayHopfOn]]を満たす。

  スキーム・形式束・曲線のいずれも $T$ に依存しない。一本の曲線がどの有限区間に制限しても Leray–Hopf 弱解になっており、区間ごとの解を零集合を除いて貼り合わせたものではない。一致は各点で成り立つ。

  主張するのは**弱解の存在**のみである。一意性も、より高い正則性も、エネルギー恒等式（等号版）も述べていない。$\mathbb{R}^3$ は周期性のない全空間である。
proof_ja: |
  **L1（一度だけ固定する）** 発散ゼロな Schwartz 関数から成る Galerkin 基底 $B$ を取り、スキームを $B$ から作られるものに固定する。続いて形式束 $F$ と基底から作られる Galerkin 近似族を固定し、[[対角極限と整合する代表元|LerayHopf.exists_diag_coherent_representative_R3]]から対角部分列 $\delta$ と曲線 $W$、および整合性の取っ手を取る。ここまでの構成は $T$ を一切参照しない。

  **L2（区間ごとの取り出し）** 自然数 $m$ を任意にとり、窓 $[0,m+1]$ で[[κ 連鎖の出口|LerayHopf.r3_kappaChain_exit]]を、再添字を $\delta$ として対角列に沿った族の上で走らせる。埋め草には L1 で固定した近似族そのものを渡す。得られる証明書がその窓での良い代表元 $v$ と弱形式・エネルギー不等式・初期トレース・エネルギー類を与える。

  **L3（代表元についての契約）** 証明書の各条項を並べて $v$ についての契約を組む。時間可測性はパッケージ曲線の可測性を、代表元との a.e. の対応に沿って移して回収する。

  **L4（対角極限との同定）** 証明書の弱収束の固定は、L1 で取った整合性の取っ手がちょうど要求する形をしている。取っ手を適用すると窓の上で $v$ と $W$ が各点一致し、[[曲線の合同|LerayHopf.Galerkin.IsLerayHopfOn.congr_Icc]]で契約が $W$ へ移る。

  **L5（任意の区間へ）** 任意の $T>0$ に対し窓 $[0,\lfloor T\rfloor+1]$ は $[0,T]$ を含むので、[[区間制限|LerayHopf.Galerkin.IsLerayHopfOn.mono]]で $[0,T]$ 上の契約が得られる。
gap:
  level: large
  note: |
    自然言語では「対角線論法で部分列を一本に選べば全時刻に伸びる」の一行だが、形式化では対角化機構・段の再帰・κ 一般化した連鎖・区間制限と曲線合同の転送補題へ展開される。

    非有界領域に固有の困難は有限区間の場合と同じで、大域 Rellich が破綻するためコンパクト性を球ごとに局所化し、Schwartz テスト関数の急減少性で球外の裾を一様に抑えて非線形項の極限移行を成立させる。時間大域化はこの局所化の上に対角化を重ねる形で行われ、新たな空間側の仮定は加えていない。

    区間制限が可積分性の追加仮定なしに閉じていること、曲線合同の仮定が各点一致であってほとんど至る所の一致でないことは[[トーラス側の主定理|LerayHopf.exists_global_lerayHopf_torus3]]と同じ事情による。

    証拠となるスキームは基底から作られる具体的なものを使う。スキームの存在定理から取ると基底を捨ててしまい、スキームごとの常微分方程式の仮定を再び持ち込むことになるため用いない。この $\mathbb{R}^3$ 時間大域主定理はカーネルのみで閉じている（追加公理ゼロ）。
provenance: |
  leray-hopf issue #195（𝕋³ 系統）/ #212（ℝ³ 系統）の時間大域キャンペーンで導入。 $\mathbb{R}^3$ 系統（issue #212）の最終段。トーラス系統の対応物を節ごとに写したもの。
