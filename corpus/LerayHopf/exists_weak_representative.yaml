name: LerayHopf.exists_weak_representative
tier: gloss
statement_ja: |
  弱連続な代表元の構成。粘性係数と時間長を正、取り出した部分列を狭義単調とする。この Aubin–Lions の極限に対し、時刻ごとに定まる曲線 $v$ と部分列を取り直して、次の 6 つを同時に満たすようにできる。

  $v$ は $[0,T]$ 上ほとんど至るところ極限と一致し、ほとんどすべての時刻で近似列が強収束し、**すべての**時刻と**すべての**方向について内積が収束し、ノルムが初期値のノルム以下に留まり、時刻 $0$ で初期値そのものになり、任意の Galerkin テストとの内積が $[0,T]$ 上 Lipschitz になる。

  「ほとんど至るところ」でしか言えなかった収束を、テストごとの一様 Lipschitz 性と稠密性によって**すべての時刻**へ広げるのが構成の要点である。方向についても、Galerkin テストの稠密性と発散ゼロ部分空間の直交補空間の扱いによって任意の方向へ広げ、最後に Riesz の表現で曲線を組み立てる。
gap:
  level: mild
  note: |
    結論が 6 つの連言であり、各成分が別々の補題（テストごとの Cauchy 性、全方向への拡張、弱極限の組み立て）に対応する。$t=0$ での値の固定は初期条件と射影の収束から別途出す。
provenance: |
  Wave 4 の private gloss 機械生成テンプレートから、issue #74 第9波（Torus 極限移行チェーン: `ConvectionExtension` → `LimitPassage` → `TraceEnergy` → `ViscousLimit`）で手書き化。抽出元: `LerayHopf/Torus/TraceEnergy.lean` の `LerayHopf.exists_weak_representative`。
chapter: energy
tags: [private-helper, torus, energy]
