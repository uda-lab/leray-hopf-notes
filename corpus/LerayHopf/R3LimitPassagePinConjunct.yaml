name: LerayHopf.R3LimitPassagePinConjunct
tier: full
statement_ja: |
  **弱収束の固定条項の凍結された形。** $\mathbb{R}^3$ の極限移行の結論に加わった条項を、独立した命題として書き出したもの。

  内容は、区間 $[0,T]$ のすべての時刻と周囲の $L^2$ ベクトル場全体を走るすべてのテスト元について、**有効添字**（再添字 $\kappa$ とパッケージの抽出の合成）に沿った Galerkin 近似との内積が、代表元 $v$ との内積へ収束することである。
proof_ja: |
  条項の形を定義として固定しておくことで、極限移行の結論がこの形から逸れていないことを型検査で確かめられる。素の抽出ではなく有効添字に沿って述べられている点が要で、再添字を通した後も収束が同じ列の上で語られていることを保証する。
gap:
  level: none
provenance: |
  leray-hopf issue #195（𝕋³ 系統）/ #212（ℝ³ 系統）の時間大域キャンペーンで導入。極限移行の結論を強化した際に、強化部分の形を凍結するために置かれた。
chapter: limit-passage
tags: [kappa-chain, time-global, r3]
