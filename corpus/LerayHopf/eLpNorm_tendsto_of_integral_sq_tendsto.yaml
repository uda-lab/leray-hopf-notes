name: LerayHopf.eLpNorm_tendsto_of_integral_sq_tendsto
tier: gloss
statement_ja: |
  ノルム自乗の時間積分が $0$ に収束するなら、時空間の $L^2$ ノルムも $0$ に収束する。時間長を正とし、各項がほとんど至るところ強可測で一様に有界であることを仮定する。実数値の区間積分と拡張実数値の $L^2$ ノルムのあいだを移すための補題である。
gap:
  level: mild
  note: |
    一様有界性は、区間積分と $L^2$ ノルムの対応を有限性の側から保証するために使う。
provenance: |
  Wave 4 の private gloss 機械生成テンプレートから、issue #74 第11波（Torus モード/Galerkin 連鎖: `AubinLionsAssembly` → `ModeTail` → `ModeCompactness` → `GalerkinODESolve`）で手書き化。抽出元: `LerayHopf/Torus/AubinLionsAssembly.lean` の `LerayHopf.eLpNorm_tendsto_of_integral_sq_tendsto`。
chapter: compactness
tags: [private-helper, torus, compactness]
