name: LerayHopf.measurable_natFloor_real
file: LerayHopf/Bochner/StepFunctionCompactness.lean
tier: gloss
statement_ja: |
  実数に対する自然数値の床函数は可測である。この床は、非負の実数に対してはそれ以下の最大の自然数を返し、**負の実数に対しては $0$ を返す**（負の数以下の自然数は存在しないため、切り詰める規約になっている）。

  値域が可算なので、各値の逆像が可測集合であることを見れば足りる。$0$ の逆像は $1$ 未満の実数全体であり、負の実数もすべてここに含まれる。$0$ でない $n$ の逆像は $n$ 以上 $n+1$ 未満の区間である。
gap:
  level: none
  note: |
    同名の宣言が `LerayHopf/R3/SpacetimePrecompact.lean` にも複製として存在する。名前が衝突するため corpus 側は whole-slug のファイル名と `file` フィールドで区別している。
