name: LerayHopf.measurable_natFloor_real
file: LerayHopf/Bochner/StepFunctionCompactness.lean
tier: gloss
statement_ja: |
  実数に対する床函数（その数以下の最大の自然数を返す操作）は可測である。値域が可算なので、各値の逆像が可測集合であることを見ればよい。$0$ の逆像は $1$ 未満の区間、$0$ でない $n$ の逆像は $n$ 以上 $n+1$ 未満の区間である。
gap:
