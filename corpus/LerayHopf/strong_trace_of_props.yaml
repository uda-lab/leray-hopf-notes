name: LerayHopf.strong_trace_of_props
tier: gloss
statement_ja: |
  初期値に対する**強い**トレース。時間長の正値性と、上と同じ 3 つの仮定（ノルムの一様上界・時刻 $0$ での値・Galerkin テストごとの Lipschitz 性）のもとで、$t\to 0^+$ で $v(t)$ は初期値へノルムの意味で収束する。

  $$\lVert v(t)-u_0\rVert^2\ =\ \lVert v(t)\rVert^2-2\langle v(t),u_0\rangle+\lVert u_0\rVert^2\ \le\ 2\lVert u_0\rVert^2-2\langle v(t),u_0\rangle$$

  右辺は弱いトレースにより $0$ へ収束する。ノルムの一様上界と弱収束を合わせると強収束が出る、という典型的な議論である。
gap:
