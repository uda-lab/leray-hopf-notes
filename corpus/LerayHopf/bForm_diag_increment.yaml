name: LerayHopf.bForm_diag_increment
tier: gloss
statement_ja: |
  対角成分の増分を、片側ずつの差 2 つに分ける恒等式。第 1 変数と第 2 変数に同じ元を入れた値の差は、次のように書ける。

  $$b(x,x,w)-b(y,y,w)\ =\ b(x-y,\,x,\,w)+b(y,\,x-y,\,w)$$

  各変数についての差の分解を順に用いる。右辺の 2 項はいずれも $x-y$ を一方の変数に持つため、$x$ と $y$ が近いときに増分を小さく評価する形になっている。
gap:
  level: none
provenance: |
  Wave 4 の private gloss 機械生成テンプレートから、issue #74 第7波（`TrilinearEstimate.lean`＋`GalerkinTrilinearBound.lean` クラスタ）で手書き化。抽出元: `LerayHopf/R3/GalerkinTrilinearBound.lean` の `LerayHopf.bForm_diag_increment`。
chapter: limit-passage
