name: LerayHopf.TorusConvectionExtension.reidxKM
tier: gloss
statement_ja: |
  格子添字の対に対する対合的な置換。$(k,l)\mapsto(k,-(k+l))$ で定める。第 1 成分は変えず、第 2 成分を残りの「和がゼロになる」相手へ移す。同じ式が逆写像にもなる。三重積の総和で、独立に走る 2 添字と「和がゼロ」という拘束のあいだを行き来するために使う。
gap:
  level: none
provenance: |
  Wave 4 の private gloss 機械生成テンプレートから、issue #74 第9波（Torus 極限移行チェーン: `ConvectionExtension` → `LimitPassage` → `TraceEnergy` → `ViscousLimit`）で手書き化。抽出元: `LerayHopf/Torus/ConvectionExtension.lean` の `LerayHopf.TorusConvectionExtension.reidxKM`。
chapter: limit-passage
tags: [private-helper, torus, convection]
