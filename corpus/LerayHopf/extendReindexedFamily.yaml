name: LerayHopf.extendReindexedFamily
tier: full
statement_ja: |
  **添字を読み替えた族の埋め込み（トーラス）。** 添字を $\varphi_1$ で読み替えた Galerkin 近似の族が与えられたとき、それを全添字にわたる族へ延長する。$\varphi_1(k)$ の形の添字では与えられた族の値をそのまま使い、それ以外の添字では[[トーラスの標準 Galerkin 解|LerayHopf.galSeq_of_torus]]で埋める。

  標準解は追加の仮定なしに常に構成できるので、補助族の存在に条件は要らない。
proof_ja: |
  対角化で得られる部分列に沿った近似の族は、添字が飛び飛びの「従属した族」の形をしている。一方でコンパクト性の連鎖は全添字にわたる族を入力に取る。この差を埋めるのが本項目である。

  延長は情報を足しているだけで、部分列上の値は変えない。そのことは[[部分列上での復元|LerayHopf.extendReindexedFamily_apply]]が保証する。
gap:
  level: mild
  note: |
    添字が $\varphi_1$ の像に入るかどうかで場合分けするため、判定に排中律を使う。像に入る場合の値の取り出しは選択を経由するが、$\varphi_1$ が単射なら選ばれる原像は一意に定まり、結果は選択に依存しない。
provenance: |
  leray-hopf issue #195（𝕋³ 系統）/ #212（ℝ³ 系統）の時間大域キャンペーンで導入。
chapter: limit-passage
tags: [kappa-chain, time-global, torus]
