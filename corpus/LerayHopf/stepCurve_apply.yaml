name: LerayHopf.stepCurve_apply
tier: gloss
statement_ja: |
  [[階段曲線|LerayHopf.stepCurve]]の値。分割数が正のとき、時刻 $t$ での値は、$t$ が属する区画の番号に対応する標本点の値である。区画番号は $t$ を区画幅で割った商の整数部分を取り、最後の区画に丸めて定める。
