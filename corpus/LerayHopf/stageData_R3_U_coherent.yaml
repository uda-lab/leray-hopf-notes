name: LerayHopf.stageData_R3_U_coherent
tier: full
statement_ja: |
  **段の極限どうしの整合性（$\mathbb{R}^3$）。** 時刻 $t$ が第 $a$ 段の区間と第 $b$ 段の区間の両方に属するならば、二つの段の弱極限はその時刻で一致する。
proof_ja: |
  どちらの段の極限も[[移送|LerayHopf.stageData_R3_diag_tendsto]]により同じ対角列に沿った内積列の極限なので、極限の一意性から、発散ゼロ部分空間を走る任意のテスト元との内積が一致する。

  [[部分空間の分離性|LerayHopf.L2Sigma_R3_eq_of_forall_inner]]により、内積がすべて一致すれば元そのものが一致する。
gap:
  level: none
  note: |
    収束不変量は全空間テストで述べられているが、一致を導くには発散ゼロ部分空間を走るテストだけで足りる。強い方の不変量から必要な分だけを使っている。
chapter: compactness
tags: [diagonal-subsequence, time-global, r3]
