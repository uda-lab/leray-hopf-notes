name: LerayHopf.furtherRestrict
tier: gloss
statement_ja: |
  半径 $k$ の閉球上の $L^2$ 元を、より小さい半径 $R\le k$ の閉球上の $L^2$ 元へ制限する操作。下にある概函数を取り直して定義する。小さい球上の測度が大きい球上の測度以下であることから、可積分性が保たれ定義が成り立つ。
gap:
