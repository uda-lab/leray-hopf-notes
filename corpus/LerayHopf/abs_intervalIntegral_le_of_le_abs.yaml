name: LerayHopf.abs_intervalIntegral_le_of_le_abs
tier: gloss
statement_ja: |
  区間積分に対する一般的な優関数評価。閉区間上で連続な 2 つの関数について、一方の絶対値が他方以下であるなら、**部分区間**上の積分の絶対値は、優関数の**全区間**上の積分で押さえられる。

  $$\Bigl|\int_x^y R\Bigr|\ \le\ \int_a^b \mathrm{bd}$$

  部分区間の取り方によらない評価が得られるため、時間の刻み幅について一様な評価を作るのに使う。
