name: LerayHopf.stokes_abs_le'
tier: gloss
statement_ja: |
  帯域制限されたテスト場に対する Stokes 形式の $L^2$ 有界性。テスト場にのみ依存する非負定数で、任意の場に対する値が場のノルムの定数倍以下に押さえられる。
gap:
  level: none
  note: |
    `LerayHopf/Torus/LimitPassage.lean` の `private` な `stokes_abs_le` の複製である。こちらの証明は同ファイル内の `stokes_boxSum` を経由する。
provenance: |
  Wave 4 の private gloss 機械生成テンプレートから、issue #74 第9波（Torus 極限移行チェーン: `ConvectionExtension` → `LimitPassage` → `TraceEnergy` → `ViscousLimit`）で手書き化。抽出元: `LerayHopf/Torus/TraceEnergy.lean` の `LerayHopf.stokes_abs_le'`。
chapter: energy
tags: [private-helper, torus, limit-passage]
