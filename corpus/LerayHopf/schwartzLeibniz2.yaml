name: LerayHopf.schwartzLeibniz2
tier: gloss
statement_ja: |
  Schwartz の水準での Leibniz 型の部分積分。実数値 Schwartz 関数 $f,g,\varphi$ と方向 $e_a$ に対し、微分をテスト関数から積の側へ移せる。

  $$\int f\,g\,(\partial_a\varphi)\ =\ -\int\bigl((\partial_a f)\,g+f\,(\partial_a g)\bigr)\varphi$$

  古典的な Leibniz 則と、Schwartz 関数に対する部分積分を合わせたもの。後段で $H^1$ の 2 因子へ持ち上げる際の出発点になる。
