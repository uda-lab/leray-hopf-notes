name: LerayHopf.weak_trace_inner
tier: gloss
statement_ja: |
  初期値に対する弱いトレース。時間長を正とし、曲線 $v$ が $[0,T]$ 上でノルムを初期値以下に保ち、時刻 $0$ で初期値に一致し、任意の Galerkin テストとの内積が Lipschitz であるとする。このとき初期値との内積は $t\to 0^+$ で初期値の自乗ノルムに収束する。

  $$\langle v(t),u_0\rangle\ \longrightarrow\ \langle u_0,u_0\rangle$$

  初期値を帯域制限された場で近似し、その各々についてはテストごとの Lipschitz 性で扱い、残差を一様ノルム評価で押さえる、という 3 段の評価による。
gap:
  level: none
provenance: |
  Wave 4 の private gloss 機械生成テンプレートから、issue #74 第9波（Torus 極限移行チェーン: `ConvectionExtension` → `LimitPassage` → `TraceEnergy` → `ViscousLimit`）で手書き化。抽出元: `LerayHopf/Torus/TraceEnergy.lean` の `LerayHopf.weak_trace_inner`。
