name: LerayHopf.stageData_R3
tier: full
statement_ja: |
  **段の再帰（$\mathbb{R}^3$）。** 第 $m$ 段の[[段の状態|LerayHopf.StageData_R3]]を、区間 $[0,m+1]$ における[[段の取り出し|LerayHopf.exists_weakLimitCurve_R3_kappa]]を繰り返して構成する。

  第 $0$ 段では $\kappa$ を恒等写像とし、第 $m+1$ 段では前段の合成添字写像を $\kappa$ として渡す。新たに得られた添字写像は段間のものとして記録し、前段の合成添字写像に右から合成する。
proof_ja: |
  [[トーラス側の段の再帰|LerayHopf.stageData]]と同じ構成で、段の取り出しだけが $\mathbb{R}^3$ のものに置き換わっている。前段の合成添字写像を $\kappa$ として渡すことで、各段が前段までの細分の上でさらに細くしていることが主張の形として保証される。
gap:
  level: mild
  note: |
    各段の抽出は存在証明から選択によって取り出しており一意ではない。段間の添字写像と合成添字写像の対応が定義どおりであることは[[合成の一致|LerayHopf.stageData_R3_comp_eq_nestedComp]]で機械検査される。
provenance: |
  leray-hopf issue #195（𝕋³ 系統）/ #212（ℝ³ 系統）の時間大域キャンペーンで導入。
chapter: compactness
tags: [diagonal-subsequence, time-global, r3]
