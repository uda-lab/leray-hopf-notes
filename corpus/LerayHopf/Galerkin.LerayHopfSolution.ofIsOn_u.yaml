statement_ja: |
  [[条件からの組み立て|LerayHopf.Galerkin.LerayHopfSolution.ofIsOn]]が持つ曲線は、もとの曲線そのものである。
proof_ja: |
  組み立ての定義がそのまま曲線を移しているので、定義から直ちに従う。
gap:
