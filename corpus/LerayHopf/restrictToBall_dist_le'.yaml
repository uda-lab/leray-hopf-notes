name: LerayHopf.restrictToBall_dist_le'
tier: gloss
statement_ja: |
  [[球への制限|LerayHopf.restrictToBall]]は $1$-Lipschitz である。制限した $2$ 元の距離は、制限する前の距離を超えない。制限は積分域を縮めるだけだからである。
gap:
  level: none
  note: |
    `LerayHopf/R3/AubinLionsLimitPassage.lean` の `private` 宣言の複製として置かれている（`private` は import 境界を越えて見えない）。`LerayHopf/R3/ArzelaAscoliTime.lean` の `norm_restrictToBall_sub_le` も同じ内容を差のノルムの形で述べている。
provenance: |
  Wave 4 の private gloss 機械生成テンプレートから、issue #74 第8波（コンパクト性エンジン 4 モジュール: `SpatialCompactness` / `SpacetimePrecompact` / `ArzelaAscoliTime` / `Bochner.StepFunctionCompactness`）で手書き化。抽出元: `LerayHopf/R3/SpacetimePrecompact.lean` の `LerayHopf.restrictToBall_dist_le'`。
chapter: compactness
tags: [private-helper, compactness, spatial-compactness]
