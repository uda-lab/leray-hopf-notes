name: LerayHopf.tendsto_integral_pairing
tier: gloss
statement_ja: |
  Hölder 共役で、いずれも $1$ 以上の指数の対に対する $L^p\times L^q$ のペアリングが、第 2 変数について連続であること。$k_n\to k_0$ が $L^q$ で成り立てば、固定した $c$ との積の積分も収束する。

  $$\int c\,k_n\ \longrightarrow\ \int c\,k_0$$

  [[$H^1$ の 2 因子に対する弱 Leibniz 則|LerayHopf.h1Leibniz2]]で、Schwartz 近似から極限へ移るときに使う。
