statement_ja: |
  Galerkin 解のノルムが、レベルによらず初期値のノルムで押さえられること。非負の各時刻について成り立つ。エネルギー評価と、射影がノルムを増やさないことを合わせて得られる。**レベル $n$ に依存しない**評価であることが、後段でコンパクト性を引き出すために効く。
