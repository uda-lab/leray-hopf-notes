name: LerayHopf.galerkin_visc_cont
tier: gloss
statement_ja: |
  Galerkin 曲線に沿った粘性散逸が $[0,\infty)$ 上で連続であること。帯域制限により有限和に落ちることから従う。
gap:
  level: none
  note: |
    `LerayHopf/Torus/TraceEnergy.lean` の `private` な `galerkin_viscous_continuousOn` の再証明である。`private` は import 境界を越えて見えないため、同じ主張をこのファイル内で `viscousFormSq_bandlim` 経由で立て直している。
provenance: |
  Wave 4 の private gloss 機械生成テンプレートから、issue #74 第9波（Torus 極限移行チェーン: `ConvectionExtension` → `LimitPassage` → `TraceEnergy` → `ViscousLimit`）で手書き化。抽出元: `LerayHopf/Torus/ViscousLimit.lean` の `LerayHopf.galerkin_visc_cont`。
