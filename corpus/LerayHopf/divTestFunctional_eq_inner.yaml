name: LerayHopf.divTestFunctional_eq_inner
tier: gloss
statement_ja: |
  [[弱発散汎関数|LerayHopf.divTestFunctional]]が内積で表せること。テスト函数 $\varphi$ に対するこの汎関数の値は、$\varphi$ の勾配ベクトル場との全空間 $L^2$ 内積に等しい。

  $$\langle\nabla\varphi,\,w\rangle$$

  弱い発散の条件を、内積の消滅として扱えるようにする書き換えである。
