name: LerayHopf.integral_schwartz_eq_toLp
tier: gloss
statement_ja: |
  Schwartz 関数の値で書いた積分と、その $L^2$ 類の代表元で書いた積分は一致する。$L^2$ 類の代表元がもとの関数とほとんど至るところ等しいことによる。第 3 因子は任意の実数値関数でよく、**可測性も有界性も要求しない** — 両辺の被積分関数がほとんど至るところ一致することだけを使うためである。
gap:
