name: LerayHopf.Galerkin.badTail_truncation
tier: full
statement_ja: |
  [[裾の切り落とし|LerayHopf.Galerkin.setIntegral_Ioc_eq_of_tail_zero]]が非可積分な場合にも成り立つことの具体的検証：[[非可積分な見本|LerayHopf.Galerkin.badTail]]について $(0,2]$ 上の積分と $(0,1]$ 上の積分は一致する。
proof_ja: |
  [[裾の切り落とし|LerayHopf.Galerkin.setIntegral_Ioc_eq_of_tail_zero]]に、$1\le 2$ と[[裾の消滅|LerayHopf.Galerkin.badTail_tail_zero]]を代入すればよい。
gap:
  level: none
provenance: |
  codex レビューが提起した「非可積分な前半をもつ場合に裾の切り落としは正当か」という論点に対する、機械検査された回答として追加された。
