name: LerayHopf.sum_mul_le_mul_sum
tier: gloss
statement_ja: |
  有限個の非負実数の族に対する、積の総和と総和の積の比較。

  $$\sum_{i} x_i\,y_i\ \le\ \Bigl(\sum_i x_i\Bigr)\Bigl(\sum_i y_i\Bigr)$$

  非負性は添字集合の各元について仮定する。右辺は交差項を余分に含むため、その分だけ左辺より大きい。
gap:
