name: LerayHopf.gradVF
tier: gloss
statement_ja: |
  Schwartz テスト函数の勾配を、$L^2$ ベクトル場の元として表したもの。各方向の偏微分を成分に持つベクトル場である。

  $$\nabla\varphi(x)\ =\ \sum_j (\partial_j\varphi)(x)\,e_j$$

  各スカラー成分を $L^2$ 元として取り、基底方向へ埋め込んで足し上げることで構成する。
