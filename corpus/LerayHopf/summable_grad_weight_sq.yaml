name: LerayHopf.summable_grad_weight_sq
tier: gloss
statement_ja: |
  $H^1$ に属する成分については、勾配側の重みを掛けた係数の自乗和が総和可能であること。

  $$\sum_l\Bigl(\sum_i l_i^2\Bigr)\bigl\lVert\hat f(l)\bigr\rVert^2\ <\ \infty$$

  $H^1$ の重み $1+\sum_i l_i^2$ に含まれる分として押さえられる。
