name: LerayHopf.latticeInvol
tier: gloss
statement_ja: |
  格子添字の対に対する対合 $(k,l)\mapsto(k,-(k+l))$。反対称性のための添字の張り替えに使う。

  **全格子上では無条件に使える**点が要である。箱で切断した版は、箱の直積が同じ対合で保たれないため、両者がモード空間に属することを仮定しないと使えない。
gap:
