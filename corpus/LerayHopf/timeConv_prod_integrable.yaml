name: LerayHopf.Bochner.timeConv_prod_integrable
tier: gloss
statement_ja: |
  時間方向の畳み込みの被積分関数を 2 変数の関数と見たとき、直積測度について可積分であること。係数関数が連続でコンパクト台を持ち、軟化子が正規化されており、場が局所可積分であることを仮定する。切り出しごとの可積分性に加えて、台のコンパクト性で有界な箱の上での評価に帰着させる。Fubini の定理を適用するための前提である。
gap:
  level: mild
  note: |
    切り出しの可積分性だけでは直積可積分性は出ないため、台のコンパクト性による箱への閉じ込めが別途要る。
provenance: |
  Wave 4 の private gloss 機械生成テンプレートから、issue #74 第12波（最終波・残り全成分）で手書き化。抽出元: `LerayHopf/Bochner/TimeMollifierInterval.lean` の `LerayHopf.Bochner.timeConv_prod_integrable`。
chapter: bochner
tags: [private-helper, bochner]
