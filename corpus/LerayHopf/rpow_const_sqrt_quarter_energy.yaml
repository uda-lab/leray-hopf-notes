name: LerayHopf.rpow_const_sqrt_quarter_energy
tier: gloss
statement_ja: |
  非負の実数 $C,V$ に対する指数の整理。

  $$\bigl(C\sqrt V\bigr)^{1/2}\ =\ \sqrt C\;V^{1/4}$$

  補間評価の右辺を、粘性散逸形式の $1/4$ 乗を含む形に書き換えるために用いる。
