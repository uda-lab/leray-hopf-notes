name: LerayHopf.perTest_hasDerivAt
tier: gloss
statement_ja: |
  テスト場との内積で作ったスカラー曲線の微分。テスト場 $w$ がレベル $n$ の射影で不変なとき、非負の各時刻で次の微分係数を持つ。

  $$\frac{d}{dt}\langle u_n(t),w\rangle\ =\ -\bigl(\nu\,S(u_n(t),w)+b(u_n(t),u_n(t),w)\bigr)$$

  曲線の微分可能性と、各時刻で成り立つ常微分方程式を組み合わせたもの。
gap:
  level: none
provenance: |
  Wave 4 の private gloss 機械生成テンプレートから、issue #74 第9波（Torus 極限移行チェーン: `ConvectionExtension` → `LimitPassage` → `TraceEnergy` → `ViscousLimit`）で手書き化。抽出元: `LerayHopf/Torus/TraceEnergy.lean` の `LerayHopf.perTest_hasDerivAt`。
chapter: energy
tags: [private-helper, torus, galerkin]
