name: LerayHopf.divFree_intLeft
tier: gloss
statement_ja: |
  弱い意味での発散ゼロの条件を、微分を移した形で言い換えたもの。仮定は、任意の Schwartz テスト関数 $\varphi$ に対して次が成り立つことである。

  $$\sum_a\int \psi_{u,a}\,(\partial_a\varphi)\ =\ 0$$

  このとき、微分をテスト関数から場の側へ移した次の等式も、任意の $\varphi$ について成り立つ。

  $$\sum_a\int (\partial_a\psi_{u,a})\,\varphi\ =\ 0$$

  各項に一度の部分積分を施すだけで得られる。
gap:
