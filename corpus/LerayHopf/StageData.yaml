name: LerayHopf.StageData
tier: full
statement_ja: |
  **段ごとの再帰の担い手（トーラス）。** 第 $m$ 段の状態として、次の四つを束ねて保持する。

  第一に前段の部分列に対する**相対抽出**とその狭義単調性、第二に第 $0$ 段から数えた**絶対抽出**とその狭義単調性、第三に第 $m$ 段の弱極限曲線 $U$、第四に収束不変量である。

  収束不変量は、区間 $[0,m+1]$ のすべての時刻 $t$ と[[発散ゼロ部分空間|LerayHopf.L2Sigma]]のすべてのテスト元 $z$ について、絶対抽出に沿った Galerkin 近似との内積が $\langle U(t),z\rangle$ へ収束することを述べる。
proof_ja: |
  時間大域化では、区間を $[0,1]\subset[0,2]\subset\cdots$ と汲み尽くしながら各段で部分列を細くしていく。素朴にやると細くした列が段ごとに違うため一本に定まらない。

  そこで段の状態に相対抽出と絶対抽出の両方を持たせ、相対抽出の側を抽象的な対角化機構へ渡せる形にしてある。絶対抽出は収束不変量を述べるために、相対抽出は対角化のために使う。
gap:
  level: mild
  note: |
    収束は弱収束（内積の収束）であって強収束ではない。各段の窓が $[0,m+1]$ と有限なのは、コンパクト性の道具が有限区間でしか使えないためで、窓を広げる操作が段の再帰そのものになっている。
provenance: |
  leray-hopf issue #195（𝕋³ 系統）/ #212（ℝ³ 系統）の時間大域キャンペーンで導入。
chapter: compactness
tags: [diagonal-subsequence, time-global, torus]
