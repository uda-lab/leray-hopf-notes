name: LerayHopf.negLapSchwartz
tier: gloss
statement_ja: |
  実数値 Schwartz 関数に対する負の Laplacian を、ふたたび Schwartz 関数として与える構成。

  $$-\Delta f\ =\ -\sum_a\partial_a\partial_a f$$

  Schwartz 関数として扱えるので、標準的な $L^2$ 類を持つ。
