name: LerayHopf.psi_zero_of_tsupport_Ioo
tier: gloss
statement_ja: |
  時間の試験関数が左端で消えること。台の閉包が開区間 $(0,T)$ に含まれるなら、$0$ での値は $0$ である。$0$ は台の閉包に属さないからである。
gap:
  level: none
  note: |
    正値性の仮定 $0<T$ は型に現れるが証明では使われていない（`_hT` と命名されている）。結論は $T$ の符号によらない。
provenance: |
  Wave 4 の private gloss 機械生成テンプレートから、issue #74 第9波（Torus 極限移行チェーン: `ConvectionExtension` → `LimitPassage` → `TraceEnergy` → `ViscousLimit`）で手書き化。抽出元: `LerayHopf/Torus/LimitPassage.lean` の `LerayHopf.psi_zero_of_tsupport_Ioo`。
chapter: limit-passage
tags: [private-helper, torus, limit-passage]
