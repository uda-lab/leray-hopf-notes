name: LerayHopf.energy_ineq_of_representative_R3
tier: gloss
statement_ja: |
  弱連続な代表元に対する、すべての時刻でのエネルギー不等式。仮定は 6 つ — 粘性係数と時間長が正であること、取り出した部分列が狭義単調であること、代表元が $[0,T]$ 上ほとんど至るところ極限と一致すること、各時刻・各方向で弱収束すること、そして散逸が $[0,T]$ 上可積分であることである。このとき $[0,T]$ の各時刻で Leray–Hopf のエネルギー不等式が成り立つ。

  $$\tfrac12\lVert v(t)\rVert^2+\int_0^t\nu\,V_1(v)\ \le\ \tfrac12\lVert u_0\rVert^2$$

  運動エネルギーの項は自乗ノルムの弱下半連続性から各時刻で、散逸の項は空間についての下半連続性と時間についての Fatou の補題から得られる。トーラス版と同じ筋である。
gap:
  level: mild
  note: |
    結論を各時刻で述べるため、ほとんど至るところの情報しか持たない極限に対して、弱連続な代表元を経由する必要がある。
