name: LerayHopf.exists_global_lerayHopf_torus3
tier: full
statement_ja: |
  **時間大域 Leray–Hopf 弱解の存在（$\mathbb{T}^3$）。** 発散ゼロな初期値 $u_0\in L^2_\sigma(\mathbb{T}^3)$ と粘性係数 $\nu>0$ に対して、ある形式束 $F$ と曲線 $u$ が存在して、**その同じ** $u$ が**すべての** $T>0$ について $[0,T]$ 上の[[Leray–Hopf 契約|LerayHopf.Galerkin.IsLerayHopfOn]]を満たす。

  曲線は $T$ に依存しない。すなわち区間ごとに別の解を取っているのではなく、一本の曲線がどの有限区間に制限しても Leray–Hopf 弱解になっている。区間ごとの解を零集合を除いて貼り合わせたものでもなく、一致は各点で成り立つ。

  主張するのは**弱解の存在**のみである。一意性も、より高い正則性も、エネルギー恒等式（等号版）も述べていない。
proof_ja: |
  **L1（一度だけ固定する）** 形式束 $F$ と Galerkin 近似族を先に固定し、続いて[[対角部分列と大域弱極限|LerayHopf.exists_diagonal_weakly_convergent_galSeq]]から対角部分列 $\delta$ と曲線 $W$ を取る。ここまでの構成は $T$ を一切参照しないので、以後どの区間を見ても同じ $F$・同じ $\delta$・同じ $W$ が使える。この「先に固定する」ことが時間大域性の全体である。

  **L2（区間ごとの取り出し）** 自然数 $m$ を任意にとり、窓 $[0,m+1]$ で[[κ 連鎖の出口|LerayHopf.torus_kappaChain_exit]]を、再添字を $\delta$ として対角列に沿った族の上で走らせる。得られる証明書は、その窓での良い代表元 $v$ と、弱形式・エネルギー不等式・初期トレース・エネルギー類を与える。

  **L3（代表元についての契約）** 証明書の各条項をそのまま並べると $v$ についての契約が得られる。時間可測性はパッケージ曲線の可測性を、代表元との a.e. の対応に沿って移して回収する。

  **L4（対角極限との同定）** 証明書の弱収束の固定と L1 の対角収束は、いずれも**同じ**部分列に沿った内積列の極限である。極限の一意性と[[部分空間の分離性|LerayHopf.L2Sigma_eq_of_forall_inner]]により、窓の上で $v$ と $W$ は各点一致する。よって[[曲線の合同|LerayHopf.Galerkin.IsLerayHopfOn.congr_Icc]]で契約が $W$ へ移る。

  **L5（任意の区間へ）** 任意の $T>0$ に対し、$T<\lfloor T\rfloor+1$ なので窓 $[0,\lfloor T\rfloor+1]$ は $[0,T]$ を含む。L4 で得た窓上の契約に[[区間制限|LerayHopf.Galerkin.IsLerayHopfOn.mono]]を施せば $[0,T]$ 上の契約になる。
gap:
  level: large
  note: |
    自然言語では「対角線論法で部分列を一本に選べば全時刻に伸びる」の一行だが、形式化では対角化機構・段の再帰・κ 一般化した連鎖・区間制限と曲線合同の転送補題へ展開される。

    区間制限（$T$ を縮める操作）が可積分性の追加仮定なしに閉じている点が仕掛けの要である。素朴に区間加法性を使うと被積分関数の可積分性が要るが、弱解にその可積分性は仮定されていない。定義関数の各点一致に基づく[[裾の切り落とし|LerayHopf.Galerkin.setIntegral_Ioc_eq_of_tail_zero]]がこれを回避する。

    曲線合同の仮定が各点一致であってほとんど至る所の一致でないことも重要である。初期トレースは零集合を無視できないため、a.e. の一致では移送できない。対角整合性の側が各点一致を供給するので、この強い形のままで足りている。

    この $\mathbb{T}^3$ 時間大域主定理はカーネルのみで閉じている（追加公理ゼロ）。
provenance: |
