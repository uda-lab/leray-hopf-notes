name: LerayHopf.schwartz_integral_abs_mul_le
tier: gloss
statement_ja: |
  絶対値をとってからの評価。積分の外で絶対値をとる上の形と異なり、被積分関数を各点で絶対値にしてから積分したものが同じ上界を持つ。

  $$\int|f|\,|g|\ \le\ \lVert f\rVert_{L^2}\,\lVert g\rVert_{L^2}$$

  指数対 $(2,2)$ に対する Hölder の不等式である。優関数による評価を経由する議論では、積分の外で絶対値をとる形では足りず、この形が必要になる。
gap:
