name: LerayHopf.perTest_lipschitz
tier: gloss
statement_ja: |
  テストごとの Lipschitz 評価が Galerkin レベルについて一様であること。粘性係数を正とし、テスト場 $w$ がレベル $n_0$ の射影で不変とする。このとき $w$ にのみ依存する非負定数 $L$ が存在して、$n\ge n_0$ なるすべてのレベルについて、スカラー曲線が $[0,\infty)$ 上で $L$-Lipschitz になる。

  $$|\langle u_n(t),w\rangle-\langle u_n(s),w\rangle|\ \le\ L\,|t-s|$$

  上の微分係数を、Stokes 形式の有界性と三線形形式の有界性で押さえる。どちらの定数も $w$ と初期値のノルムだけで決まり、レベルに依存しない — これが一様性の源である。
gap:
  level: mild
  note: |
    レベルの一様性は、レベル $n_0$ で固定したテストが $n\ge n_0$ でも射影で不変であること（レベル昇格）に依存する。$\mathbb R^3$ 版では射影の入れ子性が問題になるが、Torus ではこの障害がない。
provenance: |
  Wave 4 の private gloss 機械生成テンプレートから、issue #74 第9波（Torus 極限移行チェーン: `ConvectionExtension` → `LimitPassage` → `TraceEnergy` → `ViscousLimit`）で手書き化。抽出元: `LerayHopf/Torus/TraceEnergy.lean` の `LerayHopf.perTest_lipschitz`。
chapter: energy
tags: [private-helper, torus, galerkin]
