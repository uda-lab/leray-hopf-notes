name: LerayHopf.TorusConvectionExtension.shiftEquiv
tier: gloss
statement_ja: |
  整数格子の添字に対する対合的な置換。整数ベクトル $m$ を固定し、$k\mapsto -k-m$ で定める。同じ式が逆写像にもなるので、これは自分自身を逆に持つ全単射である。Fourier 側の総和で添字を張り替えるために使う。
