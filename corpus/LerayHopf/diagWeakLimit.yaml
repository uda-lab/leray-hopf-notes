name: LerayHopf.diagWeakLimit
tier: full
statement_ja: |
  **対角弱極限曲線（トーラス）。** 時刻 $t$ における値を、段番号 $m_t:=\lfloor\max(t,0)\rfloor$ の段の弱極限の $t$ での値として定める。第 $m$ 段の区間は $[0,m+1]$ であり、$t\ge0$ のときは $t\le m_t+1$ が成り立つので、この段の区間は $t$ を含む。$t<0$ でも値は定まるが、以降の主張で用いるのは非負の時刻に限る。

  どの段を選んでも値が変わらないことは[[段の整合性|LerayHopf.stageData_U_coherent]]が保証するので、この定義は段の選び方に依存しない。
gap:
  level: none
  note: |
    負の時刻でも定義を通すために $\max(t,0)$ で切り上げているが、以降の主張はすべて $t\ge0$ でのみ使われる。
chapter: compactness
tags: [diagonal-subsequence, time-global, torus]
