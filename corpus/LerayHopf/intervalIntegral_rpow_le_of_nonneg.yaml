name: LerayHopf.intervalIntegral_rpow_le_of_nonneg
tier: gloss
statement_ja: |
  時間方向の Hölder 評価。閉区間上で連続な非負関数と $0<r<1$ なる指数について次が成り立つ。

  $$\int_0^T h^r\ \le\ T^{1-r}\Bigl(\int_0^T h\Bigr)^{r}$$

  指数 $1/r$ と共役な指数を持つ定数関数 $1$ に対する Hölder の不等式である。散逸の積分から時間の刻み幅についての評価を作るときに使う。
gap:
  level: mild
  note: |
    区間の長さが正であることと、指数が開区間 $(0,1)$ にあることの両方を使う。端点では別の議論が要る。
provenance: |
  Wave 4 の private gloss 機械生成テンプレートから、issue #74 第12波（最終波・残り全成分）で手書き化。抽出元: `LerayHopf/R3/GalerkinTimeModulus.lean` の `LerayHopf.intervalIntegral_rpow_le_of_nonneg`。
chapter: ode
tags: [private-helper, galerkin, ode]
