name: LerayHopf.L2VF_projComponent_R3_norm_le_energy
tier: gloss
statement_ja: |
  成分への射影は $L^2$ 上でノルムを増やさない。ベクトル場の第 $j$ 成分を取り出す操作について、次が成り立つ。

  $$\lVert P_j u\rVert\ \le\ \lVert u\rVert$$

  各点で、ベクトルの $1$ 成分の絶対値がベクトルのノルム以下であることによる。
