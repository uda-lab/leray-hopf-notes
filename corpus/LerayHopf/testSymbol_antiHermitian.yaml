name: LerayHopf.testSymbol_antiHermitian
tier: gloss
statement_ja: |
  実数値 Schwartz 関数から作られるテスト記号の反 Hermite 対称性。波数を符号反転すると、値は複素共役の符号を変えたものになる。

  $$\sigma_\varphi(-\xi)\ =\ -\overline{\sigma_\varphi(\xi)}$$

  もとの関数が実数値であることに由来する構造的な制約であり、順方向で得られるテスト記号の全体がこの対称性を必ず満たす。
gap:
