name: LerayHopf.norm_sub_sq_le
tier: gloss
statement_ja: |
  ノルム空間における平行四辺形型の評価。任意の 2 元について次が成り立つ。

  $$\lVert a-b\rVert^2\ \le\ 2\lVert a\rVert^2+2\lVert b\rVert^2$$

  三角不等式と相加相乗平均による。内積は要らず、ノルム付きの加法群であればよい。
