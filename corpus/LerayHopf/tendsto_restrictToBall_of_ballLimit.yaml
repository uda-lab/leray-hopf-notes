name: LerayHopf.tendsto_restrictToBall_of_ballLimit
tier: gloss
statement_ja: |
  球への制限の収束が、より小さい球へ引き継がれること。全空間の $L^2$ ベクトル場 $g$ が、半径 $k$ の球上の元 $g_k$ とその球の上でほとんど至るところ一致するとし、点列の半径 $k$ への制限が $g_k$ に収束するとする。このとき任意の実数 $R\le k$ について、同じ点列の半径 $R$ への制限は $g$ の半径 $R$ への制限に収束する。

  半径 $R$ へのさらなる制限が連続であることと、制限の合成が半径について整合することを合わせて得られる。
gap:
  level: none
provenance: |
