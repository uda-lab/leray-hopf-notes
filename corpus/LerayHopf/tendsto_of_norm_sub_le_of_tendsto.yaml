name: LerayHopf.tendsto_of_norm_sub_le_of_tendsto
tier: gloss
statement_ja: |
  **収束列に押さえられた列は収束する。** すべての $n$ で $\|b_n-y\|\le\|a_n-x\|$ が成り立ち、かつ $a_n\to x$ ならば、$b_n\to y$ である。

  任意のノルム付き加法群の上で述べてあり、二つの列は**別々の空間**に住んでよい。適用点では $a$ が Sobolev 代表元 $f'$ の Schwartz 近似、$b$ がその Fourier 逆像で $f$ に収束する列であり、Sobolev 固有の構造は関与しない。挟み撃ちだけである。
gap:
