name: LerayHopf.stokes_abs_le
tier: gloss
statement_ja: |
  帯域制限されたテスト場に対する Stokes 形式の $L^2$ 有界性。$w$ がレベル $n_0$ の射影で不変なら、$w$ にのみ依存する非負定数 $C$ が存在して、任意の場 $v$ について次が成り立つ。

  $$|S(v,w)|\ \le\ C\,\lVert v\rVert$$

  $C$ は Fourier 箱の上の有限和として具体的に取れる。上の有限和表示に三角不等式と各係数の作用素ノルム評価を適用して得られる。
gap:
  level: none
  note: |
    同じ主張が `LerayHopf/Torus/TraceEnergy.lean` にも `stokes_abs_le'` として置かれている（`private` による複製）。
provenance: |
  Wave 4 の private gloss 機械生成テンプレートから、issue #74 第9波（Torus 極限移行チェーン: `ConvectionExtension` → `LimitPassage` → `TraceEnergy` → `ViscousLimit`）で手書き化。抽出元: `LerayHopf/Torus/LimitPassage.lean` の `LerayHopf.stokes_abs_le`。
chapter: limit-passage
tags: [private-helper, torus, limit-passage]
