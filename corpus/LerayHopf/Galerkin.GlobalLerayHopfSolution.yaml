name: LerayHopf.Galerkin.GlobalLerayHopfSolution
tier: full
statement_ja: |
  **時間大域 Leray–Hopf 解の束。** ただ一本の曲線 $u$ と、その**同じ** $u$ が任意の $T>0$ について[[有限区間 Leray–Hopf 契約|LerayHopf.Galerkin.IsLerayHopfOn]]を満たすという証明を保持する。

  論理的な内容は文字どおり「$u$ が存在して、すべての $T>0$ で契約が成り立つ」であり、「各 $T$ ごとに解 $u_T$ が存在する」を詰め替えたものではない。曲線が一本であることは束の構成そのものが強制している。
proof_ja: |
  量化子の順序がこの束の全内容である。有限区間の主定理は各 $T$ に対して解の存在を与えるが、そこで得られる曲線は $T$ ごとに異なりうる。時間大域の主張は、それらを一本に揃えられることを述べている。

  揃えられる根拠は、対角部分列を一度だけ取り、以後どの区間の議論も同じ部分列の上で走らせることにある。区間ごとに得られる解を後から貼り合わせるのではなく、はじめから一本の曲線を作る点が重要である。
gap:
  level: mild
  note: |
    弱解の存在のみを主張する束であり、一意性も、より高い正則性も、エネルギー恒等式（等号版）も含まない。各区間の条項は有限区間の契約と同一なので、強さの増分は「曲線が $T$ に依存しない」という一点に尽きる。
provenance: |
  leray-hopf issue #195（𝕋³ 系統）/ #212（ℝ³ 系統）の時間大域キャンペーンで導入。
chapter: galerkin-generic
tags: [galerkin-domain, time-global, leray-hopf]
