name: LerayHopf.memH1VF_of_viscousEnn_lt_top
tier: gloss
statement_ja: |
  粘性係数が正で拡張実数値の粘性和が有限なら、その場は成分ごとに [[H¹ 正則性|LerayHopf.memH1VF]] を持つ。粘性和の有限性は、Fourier 側で波数の自乗による重み付き和が有限であることを意味し、それが $H^1$ 所属の特徴づけそのものだからである。粘性係数の正値性は、係数で割って重みを取り出すために要る。
gap:
