name: LerayHopf.AubinLionsPackage_R3.effective_strictMono
tier: full
statement_ja: |
  **添字写像の合成の狭義単調性。** 部分列を定める添字写像 $\kappa$ が狭義単調ならば、[[Aubin–Lions パッケージ|LerayHopf.AubinLionsPackage_R3]]の添字写像 $\varphi$ との合成 $\kappa\circ\varphi$ も狭義単調である。
proof_ja: |
  狭義単調写像どうしの合成は狭義単調である。
gap:
  level: none
  note: |
    数学的には自明だが、役割は記述の統一にある。$\kappa$ で一般化したパッケージにおいて、元の列における添字を与えるのは $\varphi$ だけではなく合成 $\kappa\circ\varphi$ であり、添字の選び方に関する事実はすべてこの合成について述べる規約にしてある。$\varphi$ だけの単調性を直接使うと、$\kappa$ を合成する前の列についての主張になってしまう。
provenance: |
  leray-hopf issue #195（𝕋³ 系統）/ #212（ℝ³ 系統）の時間大域キャンペーンで導入。
chapter: compactness
tags: [kappa-chain, time-global, r3]
