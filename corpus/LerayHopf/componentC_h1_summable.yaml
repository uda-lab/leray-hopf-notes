name: LerayHopf.Torus.componentC_h1_summable
tier: gloss
statement_ja: |
  モード空間の元については、係数に任意の重みを掛けた自乗和が総和可能であること。場がレベル $n$ の射影で不変なら、その複素成分の [[Fourier 係数|LerayHopf.mFourierCoeff3]] は $n$ の Fourier 箱の外で消えるため、和は有限和になる。重み $g$ には何の条件も課さない — 有限個の項しか残らないからである。
