name: LerayHopf.stepCurve_eval
tier: gloss
statement_ja: |
  階段曲線の値。分割数 $m$ が正のとき、時刻 $t$ での値は次の番号に対応する標本点の値である。

  $$\min\bigl(\lfloor t\,m/T\rfloor_{\mathbb N},\ m-1\bigr)$$

  $\lfloor\cdot\rfloor_{\mathbb N}$ は負の値を $0$ に切り詰める自然数値の床である。複製元と同じく、時間長 $T$ と時刻 $t$ には条件を課しておらず、区間の外でもこの番号で値が定まる。
gap:
  level: none
  note: |
    `LerayHopf/Bochner/StepFunctionCompactness.lean` の `private` な `stepCurve_apply` の複製である（`private` は import 境界を越えて見えない）。名前は異なるが主張は同一。
provenance: |
  Wave 4 の private gloss 機械生成テンプレートから、issue #74 第8波（コンパクト性エンジン 4 モジュール: `SpatialCompactness` / `SpacetimePrecompact` / `ArzelaAscoliTime` / `Bochner.StepFunctionCompactness`）で手書き化。抽出元: `LerayHopf/R3/SpacetimePrecompact.lean` の `LerayHopf.stepCurve_eval`。
chapter: compactness
tags: [private-helper, compactness, bochner]
