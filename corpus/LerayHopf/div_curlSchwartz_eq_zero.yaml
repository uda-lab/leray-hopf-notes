name: LerayHopf.div_curlSchwartz_eq_zero
tier: gloss
statement_ja: |
  curl の発散が各点で消えること。

  $$\sum_i\partial_i(\nabla\times\psi)_i(x)\ =\ 0$$

  curl の巡回的な構造により、各項が Clairaut の定理を使って別の項と打ち消し合う。Galerkin 基底を発散ゼロに取れることの根拠になる。
