name: LerayHopf.schwartzMul_energy
tier: gloss
statement_ja: |
  2 つのスカラー値 Schwartz 関数の点ごとの積を、再び Schwartz 関数として与える構成。Hölder 型の評価を述べるために、積を Schwartz 関数として扱えるようにしておくもの。
gap:
  level: none
  note: |
    同じ構成が `TrilinearEstimate.lean` にも [[点ごとの積|LerayHopf.schwartzMul]] として置かれている。`GalerkinTrilinearBound.lean` はそのファイルを import しているが、上流の定義は `private` で import 先から見えないため、同じ構成をファイル内に置き直している。上流の版が任意次元 `n` で述べられているのに対し、こちらは $3$ 次元に固定されている。
provenance: |
  Wave 4 の private gloss 機械生成テンプレートから、issue #74 第7波（`TrilinearEstimate.lean`＋`GalerkinTrilinearBound.lean` クラスタ）で手書き化。抽出元: `LerayHopf/R3/GalerkinTrilinearBound.lean` の `LerayHopf.schwartzMul_energy`。
chapter: limit-passage
tags: [private-helper, schwartz, energy]
