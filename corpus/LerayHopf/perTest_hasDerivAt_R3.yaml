name: LerayHopf.perTest_hasDerivAt_R3
tier: gloss
statement_ja: |
  テスト場との内積で作ったスカラー曲線の微分。テスト場がレベル $n$ の射影で不変なとき、非負の各時刻で次の微分係数を持つ。

  $$\frac{d}{dt}\langle u_n(t),w\rangle\ =\ -\bigl(\nu\,S(u_n(t),w)+b(u_n(t),u_n(t),w)\bigr)$$

  曲線の微分可能性と各時刻の常微分方程式による。トーラス版の対応物を全空間へ移したものである。
