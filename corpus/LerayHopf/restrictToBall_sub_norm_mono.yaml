name: LerayHopf.restrictToBall_sub_norm_mono
tier: gloss
statement_ja: |
  球への制限で測った差のノルムは、半径について単調である。$R\le k$ のとき、半径 $R$ の球で測った差は半径 $k$ の球で測った差以下になる。小さい球が大きい球に含まれ、積分域が狭いほど値が小さいことによる。
gap:
